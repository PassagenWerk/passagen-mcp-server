[project]
name = "passagen-mcp-server"
version = "0.3.1"
description = "MCP access to Passagen paper libraries with optional collection organization"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "passagen-core>=0.9,<0.10",
    "pydantic>=2.11,<3",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/PassagenWerk/passagen-mcp-server"
Repository = "https://github.com/PassagenWerk/passagen-mcp-server"
Issues = "https://github.com/PassagenWerk/passagen-mcp-server/issues"

[tool.uv.sources]
passagen-core = { path = "../passagen-core", editable = true }

[project.scripts]
passagen-mcp = "passagen_mcp.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39,<2",
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passagen_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--cov=passagen_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["passagen_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
